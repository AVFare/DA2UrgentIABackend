# Solo para los tests. Se suma al application.yml principal (no lo reemplaza).
# H2 en memoria en modo PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:users;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

# Secreto de prueba (JwtService exige 32 caracteres como minimo).
jwt:
  secret: clave-de-pruebas-de-al-menos-32-caracteres-para-los-tests

