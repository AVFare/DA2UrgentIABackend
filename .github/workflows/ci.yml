# Compila, corre los tests y construye la imagen Docker de cada servicio del monorepo.
# Al final levanta todo con Docker Compose, como en una maquina limpia.
# Un servicio que todavia no tiene proyecto se saltea, asi el pipeline
# queda en verde mientras el resto del equipo va sumando el suyo.
name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java · ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [api-gateway, ticket-service, user-service]
    steps:
      - uses: actions/checkout@v5

      - name: Ver si el servicio ya tiene proyecto
        id: proyecto
        run: |
          if [ -f "${{ matrix.servicio }}/pom.xml" ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Sin pom.xml: se saltea."
          fi

      - uses: actions/setup-java@v5
        if: steps.proyecto.outputs.existe == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y correr tests
        if: steps.proyecto.outputs.existe == 'true'
        working-directory: ${{ matrix.servicio }}
        run: mvn -B verify

      - name: Construir la imagen Docker
        if: steps.proyecto.outputs.existe == 'true' && hashFiles(format('{0}/Dockerfile', matrix.servicio)) != ''
        run: docker build -t "urgentia-${{ matrix.servicio }}" "${{ matrix.servicio }}"

  python:
    name: Python · ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [classification-service, notification-service]
    steps:
      - uses: actions/checkout@v5

      - name: Ver si el servicio ya tiene proyecto
        id: proyecto
        run: |
          if [ -f "${{ matrix.servicio }}/requirements.txt" ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Sin requirements.txt: se saltea."
          fi

      - uses: actions/setup-python@v6
        if: steps.proyecto.outputs.existe == 'true'
        with:
          python-version: "3.12"

      - name: Instalar dependencias y correr tests
        if: steps.proyecto.outputs.existe == 'true'
        working-directory: ${{ matrix.servicio }}
        run: |
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; else pip install -r requirements.txt pytest; fi
          pytest

      - name: Construir la imagen Docker
        if: steps.proyecto.outputs.existe == 'true' && hashFiles(format('{0}/Dockerfile', matrix.servicio)) != ''
        run: docker build -t "urgentia-${{ matrix.servicio }}" "${{ matrix.servicio }}"

  node:
    name: Node · ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [reporting-service]
    steps:
      - uses: actions/checkout@v5

      - name: Ver si el servicio ya tiene proyecto
        id: proyecto
        run: |
          if [ -f "${{ matrix.servicio }}/package.json" ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Sin package.json: se saltea."
          fi

      - uses: actions/setup-node@v5
        if: steps.proyecto.outputs.existe == 'true'
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Instalar dependencias y correr tests
        if: steps.proyecto.outputs.existe == 'true'
        working-directory: ${{ matrix.servicio }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test
          npm run typecheck
          npm run test:e2e

      - name: Construir la imagen Docker
        if: steps.proyecto.outputs.existe == 'true' && hashFiles(format('{0}/Dockerfile', matrix.servicio)) != ''
        run: docker build -t "urgentia-${{ matrix.servicio }}" "${{ matrix.servicio }}"

  compose:
    name: Compose · levanta todo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Crear el .env a partir del ejemplo
        run: cp .env.example .env

      - name: Levantar todo y esperar a que este sano
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Probar el gateway desde afuera
        run: curl -fsS http://localhost:8080/health

      - name: Probar ticket critico, notificacion y reportes por el gateway
        if: hashFiles('reporting-service/scripts/verificar-integracion.cjs') != ''
        run: node reporting-service/scripts/verificar-integracion.cjs

      - name: Probar que cada base acepta a su usuario
        run: |
          set -a; . ./.env; set +a
          docker compose exec -T postgres psql "postgresql://users_user:${USERS_DB_PASSWORD}@postgres:5432/users_db" -c "select current_user"
          docker compose exec -T postgres psql "postgresql://tickets_user:${TICKETS_DB_PASSWORD}@postgres:5432/tickets_db" -c "select current_user"
          docker compose exec -T mongo mongosh "mongodb://classification_user:${CLASSIFICATION_DB_PASSWORD}@localhost:27017/classification_db" --quiet --eval "db.runCommand({ping:1})"
          docker compose exec -T mongo mongosh "mongodb://notifications_user:${NOTIFICATIONS_DB_PASSWORD}@localhost:27017/notifications_db" --quiet --eval "db.runCommand({ping:1})"
          docker compose exec -T mongo mongosh "mongodb://reporting_user:${REPORTING_DB_PASSWORD}@localhost:27017/reporting_db" --quiet --eval "db.runCommand({ping:1})"

      - name: Mostrar estado y logs si algo fallo
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 200

      - name: Bajar todo
        if: always()
        run: docker compose down -v
