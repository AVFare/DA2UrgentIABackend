openapi: 3.1.0
info:
  title: notification-service
  description: 'UrgentIA: consume eventos de tickets y registra notificaciones (email
    simulado e internas).'
  version: 0.1.0
servers:
- url: http://localhost:8080
  description: A traves del api-gateway (rol AGENTE o ADMIN)
- url: http://localhost:8084
  description: Directo al servicio (red interna)
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Indica que el servicio está levantado.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputHealth'
      security: []
  /api/notificaciones:
    get:
      tags:
      - notificaciones
      summary: Listar Notificaciones
      description: Lista notificaciones, de la más nueva a la más vieja, filtrando
        por ticket y/o destinatario.
      operationId: listar_notificaciones_api_notificaciones_get
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Página, desde 0
          default: 0
          title: Page
        description: Página, desde 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Tamaño de página (máximo 100)
          default: 20
          title: Size
        description: Tamaño de página (máximo 100)
      - name: ticketId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Filtra por ticket
          title: Ticketid
        description: Filtra por ticket
      - name: destinatario
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: GRUPO:GUARDIA o USUARIO:{uuid}
          examples:
          - GRUPO:GUARDIA
          title: Destinatario
        description: GRUPO:GUARDIA o USUARIO:{uuid}
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputPagination_OutputNotificacion_'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputError'
          description: Bad Request
  /api/notificaciones/{id}:
    get:
      tags:
      - notificaciones
      summary: Obtener Notificacion
      description: Devuelve una notificación por id.
      operationId: obtener_notificacion_api_notificaciones__id__get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputNotificacion'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputError'
          description: Not Found
components:
  schemas:
    CanalNotificacion:
      type: string
      enum:
      - EMAIL_SIMULADO
      - INTERNA
      title: CanalNotificacion
    EstadoNotificacion:
      type: string
      enum:
      - ENVIADA
      - FALLIDA
      title: EstadoNotificacion
    OutputDetalleError:
      properties:
        campo:
          type: string
          title: Campo
          examples:
          - payload.ticket.titulo
        mensaje:
          type: string
          title: Mensaje
          examples:
          - Field required
      type: object
      required:
      - campo
      - mensaje
      title: OutputDetalleError
    OutputError:
      properties:
        codigo:
          type: string
          title: Codigo
          examples:
          - VALIDACION
        mensaje:
          type: string
          title: Mensaje
          examples:
          - La solicitud no es válida
        detalles:
          anyOf:
          - items:
              $ref: '#/components/schemas/OutputDetalleError'
            type: array
          - type: 'null'
          title: Detalles
        timestamp:
          type: string
          title: Timestamp
          examples:
          - '2026-10-05T14:03:11Z'
        path:
          type: string
          title: Path
          examples:
          - /api/notificaciones
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlationid
          examples:
          - a8e1b2c3-0000-4000-8000-000000000001
      type: object
      required:
      - codigo
      - mensaje
      - timestamp
      - path
      title: OutputError
    OutputHealth:
      properties:
        status:
          type: string
          title: Status
          examples:
          - UP
        service:
          type: string
          title: Service
          examples:
          - notification-service
        version:
          type: string
          title: Version
          examples:
          - 0.1.0
      type: object
      required:
      - status
      - service
      - version
      title: OutputHealth
    OutputNotificacion:
      properties:
        id:
          type: string
          title: Id
          examples:
          - 66f7c3b2e4b0a1b2c3d4e5f7
        eventId:
          type: string
          title: Eventid
          examples:
          - 3f1b2c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        ticketId:
          type: string
          title: Ticketid
          examples:
          - 7c9e6679-7425-40de-944b-e07fc1f90ae7
        tipoEvento:
          $ref: '#/components/schemas/TipoEvento'
        destinatario:
          type: string
          title: Destinatario
          examples:
          - GRUPO:GUARDIA
        canal:
          $ref: '#/components/schemas/CanalNotificacion'
        asunto:
          type: string
          title: Asunto
          examples:
          - '[P1] Ticket escalado: No puede ingresar nadie'
        mensaje:
          type: string
          title: Mensaje
          examples:
          - 'El ticket fue escalado. Motivo: Prioridad P1. SLA: 2026-10-05T15:03:11Z'
        estado:
          $ref: '#/components/schemas/EstadoNotificacion'
        fecha:
          type: string
          title: Fecha
          examples:
          - '2026-10-05T14:03:12Z'
      type: object
      required:
      - id
      - eventId
      - ticketId
      - tipoEvento
      - destinatario
      - canal
      - asunto
      - mensaje
      - estado
      - fecha
      title: OutputNotificacion
    OutputPagination_OutputNotificacion_:
      properties:
        content:
          items:
            $ref: '#/components/schemas/OutputNotificacion'
          type: array
          title: Content
        page:
          type: integer
          title: Page
          examples:
          - 0
        size:
          type: integer
          title: Size
          examples:
          - 20
        totalElements:
          type: integer
          title: Totalelements
          examples:
          - 1
        totalPages:
          type: integer
          title: Totalpages
          examples:
          - 1
      type: object
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
      title: OutputPagination[OutputNotificacion]
    TipoEvento:
      type: string
      enum:
      - TicketCreado
      - TicketClasificado
      - TicketEscalado
      - TicketAsignado
      - TicketEstadoCambiado
      - TicketResuelto
      title: TipoEvento
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de POST /api/auth/login (user-service). Lo valida el gateway.
security:
- bearer: []
